:root{
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.6 var(--sans);-webkit-font-smoothing:antialiased;position:relative;z-index:0;min-height:100vh}
a{color:var(--accent)}
.wrap{max-width:64rem;margin:0 auto;padding:3rem 1rem 4rem}
@media (min-width:40rem){.wrap{padding:4rem 1.5rem 5rem}}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:4px}
code{font-family:ui-monospace,Consolas,monospace;font-size:.9em}
.top{display:flex;justify-content:flex-end;margin-bottom:2rem}
.theme-btn{background:var(--surface);border:1px solid var(--rule-2);color:var(--ink-2);border-radius:999px;padding:.3rem .75rem;font:inherit;font-size:.8rem;cursor:pointer}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:.65rem}
.eyebrow::before{content:"";flex:none;width:1.6rem;height:2px;background:var(--accent);border-radius:1px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,5vw,2.75rem);line-height:1.12;letter-spacing:-.01em;margin:.5rem 0 1rem;max-width:22ch}
.intro{color:var(--ink-2);max-width:40rem}
.intro p{margin:0 0 .75rem}
.overall{margin:2rem 0 2.5rem;padding-top:1rem;border-top:1px solid var(--rule);color:var(--ink-3);font-size:.9rem}
.grid{list-style:none;margin:0;padding:0;display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,18rem),1fr))}
.card{display:flex;flex-direction:column;height:100%;background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  padding:1.35rem 1.35rem 1.15rem;text-decoration:none;color:inherit;box-shadow:0 1px 0 var(--rule),0 18px 40px -34px rgba(0,0,0,.35);
  transition:border-color .2s var(--ease),transform .2s var(--ease),box-shadow .2s var(--ease)}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 1px 0 var(--rule),0 22px 40px -30px rgba(0,0,0,.4)}
.card .num{font:600 .75rem/1 var(--sans);letter-spacing:.08em;color:var(--accent);margin-bottom:.6rem}
.card h2{font-family:var(--serif);font-weight:600;font-size:1.2rem;line-height:1.3;margin:0 0 .4rem}
.card .sub{color:var(--ink-2);font-size:.9rem;margin:0 0 1rem;flex:1}
.card .facts{display:flex;flex-wrap:wrap;gap:.15rem 1rem;color:var(--ink-3);font-size:.8rem}
.bar{height:3px;background:var(--rule);border-radius:2px;margin-top:1rem;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);transform-origin:left;animation:grow .7s var(--ease) both .15s}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid li{animation:rise .4s var(--ease) both}
.status{display:flex;justify-content:space-between;margin-top:.5rem;font-size:.8rem;color:var(--ink-3)}
.status .go{color:var(--accent);font-weight:600}
footer{margin-top:3rem;color:var(--ink-3);font-size:.8rem;border-top:1px solid var(--rule);padding-top:1rem}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
/* full screen */
.tools{display:flex;align-items:center;gap:.5rem;margin-left:auto}
.fs-btn{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface);border:1px solid var(--rule-2);color:var(--ink-2);border-radius:999px;
  padding:.3rem .8rem .3rem .65rem;font:inherit;font-size:.8rem;cursor:pointer;transition:border-color .18s ease,color .18s ease}
.fs-btn:hover{border-color:var(--accent);color:var(--ink)}
.fs-btn svg{width:.95rem;height:.95rem;flex:none}
.fs-btn .fs-out{display:none} .fs-btn.on .fs-in{display:none} .fs-btn.on .fs-out{display:inline}
.fs-note{position:fixed;left:50%;bottom:1.25rem;transform:translateX(-50%);z-index:60;max-width:min(32rem,calc(100vw - 2rem));background:var(--ink);color:var(--surface);
  border-radius:8px;padding:.7rem 1rem;font-size:.875rem;line-height:1.45;box-shadow:0 12px 32px -12px rgba(0,0,0,.4)}
html:fullscreen{background:var(--paper);overflow-y:auto}
html:-webkit-full-screen{background:var(--paper);overflow-y:auto}
::backdrop{background:var(--paper)}
@media print{.tools{display:none}}
@media print{.top{display:none}.card{box-shadow:none}}

<script>
/* Full screen. Blackboard often shows an uploaded page inside a frame; when that frame doesn't allow full screen,
   the button opens the page on its own in a new tab (same address, so saved progress comes along), where full
   screen works. Hidden where the browser has no full screen for pages (iPhone). */
(function(){
  "use strict";
  var btn = document.getElementById("fsBtn"); if (!btn) return;
  var d = document, el = d.documentElement, txt = btn.querySelector(".fs-t"), timer;
  var can = !!(d.fullscreenEnabled || d.webkitFullscreenEnabled);
  var framed = (function(){ try { return window.self !== window.top; } catch(e){ return true; } })();
  var KEYS = /Mac|iPad/.test(navigator.platform || navigator.userAgent) ? "Control+Command+F" : "F11";
  function isFs(){ return !!(d.fullscreenElement || d.webkitFullscreenElement); }
  function note(msg){
    var n = d.getElementById("fsNote");
    if (!n) { n = d.createElement("div"); n.id = "fsNote"; n.className = "fs-note"; n.setAttribute("role", "status"); d.body.appendChild(n); }
    n.textContent = msg; n.hidden = false; clearTimeout(timer); timer = setTimeout(function(){ n.hidden = true; }, 7000);
  }
  function openPage(){
    var w = null;
    try { w = window.open(location.href, "_blank"); } catch(e){}
    if (w) { try { w.opener = null; } catch(e){} }
    else note("Your course page blocked the new tab. Open this page on its own, or press " + KEYS + " for full screen.");
  }
  function sync(){
    var on = isFs();
    btn.classList.toggle("on", on); btn.setAttribute("aria-pressed", on ? "true" : "false");
    txt.textContent = on ? "Exit full screen" : "Full screen";
    btn.title = on ? "Leave full screen (Esc)" : "Fill the screen with this page";
  }
  if (can) {
    btn.hidden = false; sync();
    btn.addEventListener("click", function(){
      if (isFs()) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
      var req = el.requestFullscreen || el.webkitRequestFullscreen, p;
      try { p = req.call(el, { navigationUI: "hide" }); } catch(e){ p = null; fail(); return; }
      if (p && p.catch) p.catch(fail);
    });
    d.addEventListener("fullscreenchange", sync); d.addEventListener("webkitfullscreenchange", sync);
  } else if (framed) {
    btn.hidden = false; txt.textContent = "Open full page";
    btn.title = "Open this page in its own tab, where it can go full screen";
    btn.addEventListener("click", openPage);
  }
  function fail(){ if (framed) openPage(); else note("Full screen isn't available here. Press " + KEYS + " instead."); }
})();
</script>
